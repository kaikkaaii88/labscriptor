<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LabScriptor</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="../css/experiment.css"
    >

</head>

<body>

    <!-- =========================
         HEADER
         ========================= -->

    <header class="app-header">

        <div class="header-left">

            <span class="app-brand-icon">
                <i class="fa-solid fa-flask"></i>
            </span>

            <div class="app-brand-text">

                <span class="app-brand-name">
                    LabScriptor
                </span>

                <span class="app-brand-subtitle">
                    Experiment Details
                </span>

            </div>

        </div>

        <div class="header-right">

            <button
                id="editModeButton"
                class="edit-mode-button"
                type="button"
            >
                Edit Experiment
            </button>


            <button
                id="exportDocxButton"
                type="button"
            >
                <i class="fa-solid fa-file-word"></i>
                Export DOCX
            </button>


            <button
                id="historyButton"
                type="button"
            >
                History
            </button>


            <button
                id="logoutButton"
                type="button"
            >
                Logout
            </button>

        </div>

    </header>


    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main class="experiment-page">


        <!-- =========================
             EXPERIMENT DETAILS
             ========================= -->

        <section class="details-section">

            <div class="section-header">

                <div>

                    <h2 id="experimentName">
                        Experiment
                    </h2>

                    <p id="experimentStatus">
                        Unknown
                    </p>

                </div>

            </div>


            <div class="details-grid">

                <div class="detail-card">

                    <span class="detail-label">
                        Start Time
                    </span>

                    <span id="startTime">
                        Not available
                    </span>

                </div>


                <div class="detail-card">

                    <span class="detail-label">
                        End Time
                    </span>

                    <span id="endTime">
                        Not available
                    </span>

                </div>


                <div class="detail-card">

                    <span class="detail-label">
                        Duration
                    </span>

                    <span id="duration">
                        Not available
                    </span>

                </div>


                <div class="detail-card">

                    <span class="detail-label">
                        Observations
                    </span>

                    <span id="observationCount">
                        0
                    </span>

                </div>

            </div>

        </section>


        <!-- =========================
             OBSERVATIONS
             ========================= -->

        <section class="observations-section">

            <div class="section-header">

                <div>

                    <h2>
                        Observations
                    </h2>

                    <p>
                        Recorded observations from this experiment.
                    </p>

                </div>


                <button
                    id="addObservationButton"
                    class="add-observation-button"
                    type="button"
                >
                    + Add Observation
                </button>

            </div>


            <p
                id="observationMessage"
                class="section-message"
            ></p>


            <div
                id="observationList"
                class="observation-list"
            ></div>

        </section>


        <!-- =========================
             IMAGES
             ========================= -->

        <section class="images-section">

            <div class="section-header">

                <div>

                    <h2>
                        Images
                    </h2>

                    <p>
                        Images recorded during this experiment.
                    </p>

                </div>

            </div>


            <!-- IMAGE UPLOAD -->

            <div
                id="imageUploadSection"
                class="image-upload-section"
            >

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                >


                <button
                    id="uploadImageButton"
                    type="button"
                >
                    Upload Image
                </button>


                <p id="uploadImageMessage"></p>

            </div>


            <p
                id="imageMessage"
                class="section-message"
            ></p>


            <!-- EXISTING IMAGES -->

            <div
                id="imageList"
                class="image-list"
            ></div>

        </section>

    </main>


    <!-- =========================
         SCRIPTS
         ========================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script
        src="https://cdn.jsdelivr.net/npm/docx@9.7.2/dist/index.iife.js"
    ></script>

    <script
        src="../js/experiment.js"
    ></script>

</body>

</html>
