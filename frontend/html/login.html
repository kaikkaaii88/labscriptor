<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LabScriptor Login</title>

    <link
        rel="stylesheet"
        href="../css/login.css"
    >
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <h1>LabScriptor</h1>

            <p class="login-subtitle">
                Laboratory Process Management
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    id="loginButton"
                >
                    Login
                </button>

                <p
                    id="loginMessage"
                    class="login-message"
                ></p>

            </form>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/login.js"></script>

</body>

</html>
